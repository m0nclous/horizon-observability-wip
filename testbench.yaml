# Horizon and the package are listed although package discovery finds them: testbench adds the root package only to
# a manifest its own CLI builds, and Larastan and the vendor refresh of defineCacheRoutes() rebuild it without (no view
# namespace for PHPStan, no package routes in a cached route file). Registering a provider twice is a no-op.
providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Laravel\Horizon\HorizonServiceProvider
  - DF\HorizonObservability\HorizonObservabilityServiceProvider

env:
  - APP_ENV=local
  - APP_KEY=base64:ZIBKaaFjRAY84d2anlYbSY8TIYBWEm2aVHcbUHRTD3c=
  - APP_URL=http://localhost:8000
  - DB_CONNECTION=sqlite
  - QUEUE_CONNECTION=redis
  - REDIS_CLIENT=phpredis
  - REDIS_HOST=127.0.0.1
  - REDIS_PORT=6379
  - CACHE_STORE=array
  - SESSION_DRIVER=array
  - HORIZON_OBSERVABILITY_TOKEN=workbench-token-0123456789abcdef
  - HORIZON_OBSERVABILITY_GRAFANA_URL=http://localhost:3000/d/horizon-observability
  - HORIZON_OBSERVABILITY_TTS_URL=browser

workbench:
  start: /horizon
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    views: false
    config: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
