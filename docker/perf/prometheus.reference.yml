# The reference stack of the pilot dashboard's measurement, scraped at 15 s
# (PERF_PROMETHEUS_CONFIG=prometheus.reference.yml), for reproducing it with its history (workbench:perf-data
# --schema=legacy --step=15 --job=office-horizon --instance=app:8080). See docker/perf/README.md.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: office-horizon
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8391']
    relabel_configs:
      - target_label: instance
        replacement: app:8080
