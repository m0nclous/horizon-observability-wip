# Placeholder until T13 ships resources/grafana/provisioning/datasources/horizon-observability.yaml (Arch Q2.5): the
# Infinity datasource of the job lists and the live snapshot, server-side with the API bearer token.
apiVersion: 1

datasources:
  - name: Horizon Observability API
    uid: horizon-observability-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: ${HORIZON_OBSERVABILITY_APP_URL}
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - ${HORIZON_OBSERVABILITY_APP_URL}
      customHealthCheckEnabled: true
      customHealthCheckUrl: ${HORIZON_OBSERVABILITY_APP_URL}/horizon/observability/jobs/pending?limit=1
    secureJsonData:
      bearerToken: ${HORIZON_OBSERVABILITY_API_TOKEN}
