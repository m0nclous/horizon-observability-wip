# Two replicas of one application (testbench serve on :8000 and :8001 on the host), one job: the e2e dedupe gate
# compares the dashboard against a single-target run: every query must deduplicate replicas.
# PROMETHEUS_CONFIG=prometheus.replicas.yml
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s

scrape_configs:
  - job_name: workbench-horizon
    metrics_path: /horizon/observability/metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ['host.docker.internal:8000', 'host.docker.internal:8001']
