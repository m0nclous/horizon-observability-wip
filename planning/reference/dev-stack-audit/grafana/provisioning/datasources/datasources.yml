apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9390
    isDefault: true
    jsonData:
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
  - name: App API
    uid: app-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://127.0.0.1:8089
    jsonData:
      allowedHosts: ['http://127.0.0.1:8089']
