# Алерты дашборда «Queues» (resources/grafana/dashboards/queues.json): горят по тем же правилам, по которым краснеют его плитки.
# Видны на дашборде в полосе Alerts и в Alerting → Alert rules. Точки доставки нет: Grafana шлёт по правилу
# уведомлений по умолчанию (почта), а без SMTP только пишет ошибку в лог. Куда слать — добавить contact point.
# Правила Grafana всегда лежат в папке, поэтому у них своя папка Horizon, хотя дашборд — в корне.
# Источник Prometheus — по uid из переменной окружения Grafana HPG_PROMETHEUS_DATASOURCE_UID: у правил алертов,
# в отличие от дашборда, нет источника по умолчанию.
apiVersion: 1

groups:
    - orgId: 1
      name: Queues
      folder: Horizon
      interval: 1m
      rules:
          # Ряда статуса Horizon нет: Prometheus не собирает /metrics приложения. Без этого правила
          # остальные молчали бы — у них просто не было бы данных
          - uid: horizon-no-metrics
            title: No queue metrics
            condition: C
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: ${HPG_PROMETHEUS_DATASOURCE_UID}
                  model:
                      editorMode: code
                      expr: count(office_horizon_status)
                      instant: true
                      range: false
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                      refId: C
            noDataState: Alerting
            execErrState: Error
            for: 5m
            annotations:
                summary: Prometheus has no office_horizon_status, /metrics of the app is not scraped
                __dashboardUid__: horizon
                __panelId__: "1"
            isPaused: false

          # Как красная плитка Horizon: на паузе или не запущен
          - uid: horizon-down
            title: Horizon is down
            condition: C
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: ${HPG_PROMETHEUS_DATASOURCE_UID}
                  model:
                      editorMode: code
                      expr: min(office_horizon_status)
                      instant: true
                      range: false
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                      refId: C
            # Без метрик горит No queue metrics
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
                summary: Horizon is paused or not running
                __dashboardUid__: horizon
                __panelId__: "1"
            isPaused: false

          # Как красная плитка Pending: самый старый ожидающий джоб очереди ждёт дольше двух её порогов
          # из horizon.waits (строго больше, как LongWaitDetected у Horizon). По алерту на очередь
          - uid: horizon-long-wait
            title: Queue wait over 2x limit
            condition: C
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: ${HPG_PROMETHEUS_DATASOURCE_UID}
                  model:
                      editorMode: code
                      expr: >-
                          max by (queue) (office_queue_oldest_pending_job_age)
                          / on (queue) max by (queue) (office_horizon_wait_threshold_seconds)
                      instant: true
                      range: false
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: gt, params: [2] }
                      refId: C
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
                summary: 'Oldest pending job in {{ $labels.queue }} waits {{ printf "%.1f" $values.A.Value }}x the queue wait limit'
                __dashboardUid__: horizon
                __panelId__: "2"
            isPaused: false

          # Как красная плитка Failed, но по очереди и за 15 минут: упавшие и таймауты — от 5% попыток,
          # и не меньше 5 штук (доля считается от попыток, но не меньше чем от 100)
          - uid: horizon-failures
            title: High failure rate
            condition: C
            data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: ${HPG_PROMETHEUS_DATASOURCE_UID}
                  model:
                      editorMode: code
                      expr: >-
                          sum by (queue) (increase(office_queue_jobs_total{status=~"failed|timed_out"}[15m]))
                          / clamp_min(sum by (queue) (increase(office_queue_jobs_total{status=~"completed|failed|timed_out"}[15m])), 100)
                      instant: true
                      range: false
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: gte, params: [0.05] }
                      refId: C
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
                summary: '{{ humanizePercentage $values.A.Value }} of attempts in {{ $labels.queue }} failed in 15 minutes'
                __dashboardUid__: horizon
                __panelId__: "4"
            isPaused: false
