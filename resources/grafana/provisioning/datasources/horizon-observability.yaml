# The Infinity datasource of the dashboard's job lists (Arch Q2.5, Q5.5): Grafana calls the application server-side
# with the API bearer token, so there is no CORS and the token never reaches a browser. Set the environment variables
# in Grafana's environment (or replace them). The panels append ${api_path}/jobs/<list> to the URL; adapt the health
# check URL when horizon-observability.path or horizon.path differ from the defaults.
apiVersion: 1

datasources:
  - name: Horizon Observability API
    uid: horizon-observability-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: ${HORIZON_OBSERVABILITY_APP_URL}                 # internal base URL of the application, reachable from Grafana
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - ${HORIZON_OBSERVABILITY_APP_URL}
      customHealthCheckEnabled: true
      customHealthCheckUrl: ${HORIZON_OBSERVABILITY_APP_URL}/horizon/observability/jobs/pending?limit=1
    secureJsonData:
      bearerToken: ${HORIZON_OBSERVABILITY_API_TOKEN}     # HORIZON_OBSERVABILITY_API_TOKEN (or _TOKEN) of the application
