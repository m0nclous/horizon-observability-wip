name: board

# Mirrors planning/TASKS.md onto issues and the GitHub Projects board, stops the line while the tests workflow is red
# on the integration branch, and rewrites the flow report (tools/board/board.sh, tools/board/README.md).
# Setup: repository secret PROJECT_TOKEN (classic PAT: repo, project, read:org, read:discussion) and repository
# variable BOARD_NUMBER (the number in the board URL). Optional variables: BOARD_OWNER (default: the repository owner),
# INTEGRATION_BRANCH (default: claude/hopeful-hawking-njeu3v), BOARD_WIP_IN_PROGRESS (2), BOARD_WIP_TESTING (3).
# workflow_run only fires from the copy of this file on the default branch.
# The owner's token (GH_TOKEN) is given only to the board.sh steps, not to the workflow, so checkout and any other
# step never see it. Owner questions are posted with this workflow's GITHUB_TOKEN (github-actions[bot]): GitHub
# notifies nobody of their own comments, and every other write uses the owner's PROJECT_TOKEN.
# board.sh warnings (a task without an area, a heading or dependency clause it cannot read, a missing board option)
# become annotations of the run.

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - planning/TASKS.md
      - tools/board/**
      - .github/workflows/board.yml
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BOARD_REPO: ${{ github.repository }}
  BOARD_OWNER: ${{ vars.BOARD_OWNER || github.repository_owner }}
  BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
  BOARD_WIP_IN_PROGRESS: ${{ vars.BOARD_WIP_IN_PROGRESS || '2' }}
  BOARD_WIP_TESTING: ${{ vars.BOARD_WIP_TESTING || '3' }}

jobs:
  sync:
    name: Sync issues and board
    # Only the integration branch's TASKS.md is the truth: another branch's copy must not move the cards, whether it
    # is pushed or run by hand (Actions -> board -> Run workflow, or MCP actions_run_trigger, on any ref).
    if: >-
      ${{ vars.BOARD_NUMBER != ''
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == (vars.INTEGRATION_BRANCH || 'claude/hopeful-hawking-njeu3v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # A pending sync is replaced by a newer one (GitHub cancels the pending job of a group when another is queued),
    # which reads the newer TASKS.md: nothing is lost.
    concurrency:
      group: board-sync
      cancel-in-progress: false
    steps:
      # The full history: Started and Finished come from the "board: Txx -> ..." commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync issues and board
        shell: bash
        run: |
          tools/board/board.sh sync 2>&1 | sed 's/^board: warning: /::warning title=board::/'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_BRANCH: ${{ github.ref_name }}
          BOARD_NOTIFY_TOKEN: ${{ github.token }}

  ci:
    name: Stop the line
    # Every run of the integration branch decides (pushes, the weekly run, manual runs); pull request runs have their
    # own checks. A green push run closes the issue only when it ran every job that is still red (board.sh ci).
    if: >-
      ${{ vars.BOARD_NUMBER != '' && github.event_name == 'workflow_run'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
      && github.event.workflow_run.head_branch == (vars.INTEGRATION_BRANCH || 'claude/hopeful-hawking-njeu3v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One job per completed tests run, in order: each decides on its own run (its comment and job record), so none may
    # be dropped. Without queue: max GitHub keeps one pending job per group and cancels it when the next is queued:
    # three runs that finish while one ci job runs would lose the middle one (a red weekly e2e job never recorded).
    # queue: max keeps up to 100 pending (actionlint 1.7.12 does not know the key yet: .github/actionlint.yaml).
    concurrency:
      group: board-ci
      cancel-in-progress: false
      queue: max
    steps:
      # The branch head and its history: a run of an older commit decides only when the commits after it change
      # nothing but TASKS.md and screenshots (which the tests workflow ignores on push).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Open, comment on or close the stop-the-line issue
        shell: bash
        run: |
          tools/board/board.sh ci 2>&1 | sed 's/^board: warning: /::warning title=board::/'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  report:
    name: Flow report
    needs: [sync, ci]
    if: ${{ always() && (needs.sync.result == 'success' || needs.ci.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Like the sync: a pending report is replaced by a newer one, which reads the newer state.
    concurrency:
      group: board-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.sha }}
          fetch-depth: 0
      - name: Rewrite the flow report
        shell: bash
        run: |
          tools/board/board.sh report 2>&1 | sed 's/^board: warning: /::warning title=board::/'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
