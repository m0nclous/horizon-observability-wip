name: board

# Mirrors planning/TASKS.md onto issues and the GitHub Projects board (tools/board/board.sh).
# Setup: repository secret PROJECT_TOKEN (Issues + Projects read/write) and repository variable BOARD_NUMBER
# (the number in the board URL). Optional variable BOARD_OWNER (default: the repository owner).

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - planning/TASKS.md
      - tools/board/**
      - .github/workflows/board.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.BOARD_NUMBER != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Sync issues and board
        run: tools/board/board.sh sync
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_REPO: ${{ github.repository }}
          BOARD_OWNER: ${{ vars.BOARD_OWNER || github.repository_owner }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
          BOARD_BRANCH: ${{ github.ref_name }}
